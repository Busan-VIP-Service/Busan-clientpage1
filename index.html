<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busan Private Concierge</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: #0b0b0b; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 100vw; min-height: 100vh; -webkit-user-select: none; user-select: none;
        }
        .wrapper { width: 100vw; min-height: 100vh; background: #161616; display: flex; flex-direction: column; }
        .slider-container {
            width: 100%; height: clamp(320px, 48svh, 560px); position: relative; overflow: hidden; flex-shrink: 0;
            isolation: isolate; background: #101014; touch-action: pan-y;
        }
        .slider-container::before {
            content: ''; position: absolute; inset: -32px; z-index: -1;
            background-image: var(--gallery-backdrop); background-position: center; background-size: cover;
            filter: blur(24px) brightness(0.35); pointer-events: none;
        }
        .slides { display: flex; width: 100%; height: 100%; transition: transform 0.5s ease-in-out; position: relative; }
        .slides img { width: 100%; flex: 0 0 100%; height: 100%; object-fit: contain; object-position: center; padding: 0; pointer-events: none; }
        .content { padding: 24px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        h2 { margin: 0 0 4px 0; font-size: 22px; letter-spacing: 0.5px; color: #f3f3f3; }
        .subtitle { font-size: 12px; color: #d4af37; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        label.section-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; margin-top: 12px; }
        .optional-tag { color: #555; font-size: 10px; font-weight: normal; margin-left: 4px; }
        .options-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
        .option-item { flex: 1; min-width: 45px; }
        .option-item input[type="radio"], .option-vertical-item input[type="radio"] { display: none; }
        .option-item label, .option-vertical-item label {
            display: block; padding: 9px 8px; background: #222; border: 1px solid #333; border-radius: 8px;
            color: #ccc; font-size: 13px; text-align: center; cursor: pointer; transition: all 0.2s; margin: 0;
        }
        .option-item input[type="radio"]:checked + label, .option-vertical-item input[type="radio"]:checked + label {
            background: rgba(212, 175, 55, 0.15); border-color: #d4af37; color: #d4af37; font-weight: bold;
        }
        .options-vertical { display: flex; flex-direction: column; gap: 6px; margin-bottom: 5px; }
        .option-vertical-item label { padding: 10px 14px; text-align: left; }
        input[type="text"], input[type="date"], input[type="number"], select {
            width: 100%; padding: 11px 12px; margin-top: 4px; margin-bottom: 4px;
            background: #222; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box; outline: none;
        }
        input[type="text"]:focus, input[type="date"]:focus, input[type="number"]:focus, select:focus { border-color: #d4af37; }
        .contact-group { display: flex; gap: 8px; margin-bottom: 4px; }
        .contact-group select { flex: 1.2; }
        .contact-group input { flex: 2.8; }
        button.submit-btn {
            width: 100%; background: linear-gradient(135deg, #e6c563 0%, #c59b27 100%); color: #000;
            border: none; padding: 14px; font-weight: bold; font-size: 15px; cursor: pointer; border-radius: 8px;
            transition: opacity 0.2s; margin-top: 20px; margin-bottom: 20px;
        }
        button.submit-btn:active { opacity: 0.8; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; width: 90%; max-width: 360px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .modal-title { font-size: 18px; color: #d4af37; font-weight: bold; margin-bottom: 10px; }
        .modal-desc { font-size: 14px; color: #bbb; margin-bottom: 25px; line-height: 1.5; }
        .modal-btn { background: #d4af37; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
        .required-star { color: #ff4d4d; font-weight: bold; }
        .slider-arrow {
            position: absolute; z-index: 11; border: 1px solid #ffffff66; background: #0009; color: white; cursor: pointer; border-radius: 24px;
            min-width: 44px; min-height: 44px; top: 50%; transform: translateY(-50%); font-size: 28px;
        }
        .slider-prev { left: 12px; } .slider-next { right: 12px; }
        @media (min-width: 768px) and (orientation: landscape), (min-width: 1024px) {
            body { overflow: hidden; }
            .wrapper { flex-direction: row; height: 100vh; }
            .slider-container { width: 55%; height: 100vh; }
            .content { width: 45%; height: 100vh; padding: 40px; }
            .mobile-only-slide { display: none !important; }
            .pc-only-slide { display: block !important; }
        }
        @media (max-width: 1023px) and (orientation: portrait), (max-width: 767px) {
            .mobile-only-slide { display: block !important; }
            .pc-only-slide { display: none !important; }
        }
    </style>
    <script src="api-config.js"></script>
    <script src="booking-api.js"></script>
</head>
<body>

    <div class="wrapper">
        <div class="slider-container" id="sliderContainer" role="region" aria-label="Busan photo gallery" aria-roledescription="carousel" tabindex="0">
            <div class="slides" id="slidesTrack">
                <img src="mobile_main.png" class="mobile-only-slide" alt="Busan Private Concierge Mobile" draggable="false" decoding="async" fetchpriority="high">
                <img src="main.png" class="pc-only-slide" alt="Busan Private Concierge PC" draggable="false" decoding="async" fetchpriority="high" style="display:none;">
                <img src="image1 (1).png" alt="Busan concierge gallery photo" draggable="false" decoding="async" loading="lazy">
                <img src="image1 (2).png" alt="Busan concierge gallery photo" draggable="false" decoding="async" loading="lazy">
                <img src="image1 (3).png" alt="Busan concierge gallery photo" draggable="false" decoding="async" loading="lazy">
                <img src="image1 (4).png" alt="Busan concierge gallery photo 4" draggable="false" decoding="async" loading="lazy">
                <img src="image1 (5).png" alt="Busan concierge gallery photo 5" draggable="false" decoding="async" loading="lazy">
                <img src="image1 (6).png" alt="Busan concierge gallery photo 6" draggable="false" decoding="async" loading="lazy">
                <img src="image1 (7).png" alt="Busan concierge gallery photo 7" draggable="false" decoding="async" loading="lazy">
                <img src="image1 (8).png" alt="Busan concierge gallery photo 8" draggable="false" decoding="async" loading="lazy">
                <img src="image1 (9).png" alt="Busan concierge gallery photo 9" draggable="false" decoding="async" loading="lazy">
                <img src="image1 (10).png" alt="Busan concierge gallery photo 10" draggable="false" decoding="async" loading="lazy">
                <img src="image1 (11).png" alt="Busan concierge gallery photo 11" draggable="false" decoding="async" loading="lazy">
                <img src="image1 (12).png" alt="Busan concierge gallery photo 12" draggable="false" decoding="async" loading="lazy">
                <img src="image1 (13).png" alt="Busan concierge gallery photo 13" draggable="false" decoding="async" loading="lazy">
                <img src="image1 (14).png" alt="Busan concierge gallery photo 14" draggable="false" decoding="async" loading="lazy">
            </div>
            <button class="slider-arrow slider-prev" id="prevSlide" type="button" aria-label="Previous photo">&#8249;</button>
            <button class="slider-arrow slider-next" id="nextSlide" type="button" aria-label="Next photo">&#8250;</button>
        </div>

        <div class="content" id="formContent">
            <h2>Plan Your Night</h2>
            <div class="subtitle">Exclusive VIP Package</div>
            <p style="font-size: 12px; color: #888; margin-bottom: 10px;"><span class="required-star">*</span> Required fields</p>

            <label class="section-label">Your Name <span class="required-star">*</span></label>
            <input type="text" id="nameInput" placeholder="Enter your name">

            <label class="section-label">Company Name <span class="optional-tag">(Optional)</span></label>
            <input type="text" id="companyInput" placeholder="Enter your company name">

            <label class="section-label">Job Title / Position <span class="optional-tag">(Optional)</span></label>
            <input type="text" id="titleInput" placeholder="e.g., Director, Manager, CEO">

            <label class="section-label">Visit Date (Schedule) <span class="required-star">*</span></label>
            <input type="date" id="dateInput">

            <label class="section-label">Party Size <span class="required-star">*</span></label>
            <div class="options-group">
                <div class="option-item"><input type="radio" id="p1" name="partySize" value="1"><label for="p1">1</label></div>
                <div class="option-item"><input type="radio" id="p2" name="partySize" value="2"><label for="p2">2</label></div>
                <div class="option-item"><input type="radio" id="p3" name="partySize" value="3"><label for="p3">3</label></div>
                <div class="option-item"><input type="radio" id="p4" name="partySize" value="4"><label for="p4">4</label></div>
                <div class="option-item" style="flex: 1.5;"><input type="radio" id="p5" name="partySize" value="More than 4"><label for="p5">5+</label></div>
            </div>

            <label class="section-label">Exact party size (for 5+)</label><input type="number" id="exactPartySize" min="5" max="100" placeholder="Enter exact number for 5+">
            
            <label class="section-label">Preferred Vibe <span class="required-star">*</span></label>
            <div class="options-vertical">
                <div class="option-vertical-item"><input type="radio" id="v1" name="vibe" value="Casual Bar"><label for="v1">Casual Lounge & Bar</label></div>
                <div class="option-vertical-item"><input type="radio" id="v2" name="vibe" value="Dynamic Night"><label for="v2">Dynamic & Private Room</label></div>
                <div class="option-vertical-item"><input type="radio" id="v3" name="vibe" value="Ultimate VIP"><label for="v3">Ultimate VIP Experience</label></div>
            </div>

            <label class="section-label">Total Group Budget (USD) <span class="required-star">*</span></label>
            <div class="options-vertical">
                <div class="option-vertical-item"><input type="radio" id="b1" name="budget" value="500 - 1000"><label for="b1">$500 - $1,000</label></div>
                <div class="option-vertical-item"><input type="radio" id="b2" name="budget" value="1000 - 2000"><label for="b2">$1,000 - $2,000</label></div>
                <div class="option-vertical-item"><input type="radio" id="b3" name="budget" value="2000 - 3000"><label for="b3">$2,000 - $3,000</label></div>
                <div class="option-vertical-item"><input type="radio" id="b4" name="budget" value="No limit"><label for="b4">No Limit / Unlimited VIP</label></div>
            </div>

            <label class="section-label">Preferred Guide / Interpreter Type <span class="required-star">*</span></label>
            <div class="options-vertical">
                <div class="option-vertical-item"><input type="radio" id="guide_pro" name="guideType" value="Professional Interpreter"><label for="guide_pro">Professional Business Interpreter (English Fluent)</label></div>
                <div class="option-vertical-item"><input type="radio" id="guide_basic" name="guideType" value="Basic Guide"><label for="guide_basic">Basic Guide (English Not Available / Standard)</label></div>
            </div>

            <label class="section-label">Hotel Name <span class="required-star">*</span></label>
            <input type="text" id="hotelInput" placeholder="e.g., Signiel Busan">

            <!-- 인증 없이 바로 입력받는 왓츠앱 / 연락처 입력창 -->
            <label class="section-label">WhatsApp / Contact Number <span class="required-star">*</span></label>
            <div class="contact-group">
                <select id="countryCode">
                    <option value="+1">🇺🇸 +1</option>
                    <option value="+61">🇦🇺 +61</option>
                    <option value="+82" selected>🇰🇷 +82</option>
                    <option value="+81">🇯🇵 +81</option>
                    <option value="+86">🇨🇳 +86</option>
                    <option value="+44">🇬🇧 +44</option>
                    <option value="+OTHER">🌐 Other</option>
                </select>
                <input type="text" id="contactInput" placeholder="Phone Number (e.g. 01012345678)">
            </div>

            <button class="submit-btn" onclick="openConfirmModal()">Request Access</button>
        </div>
    </div>

    <!-- 확인 모달 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <div class="modal-title">Confirm Request</div>
            <div class="modal-desc" id="confirmText">Are you ready to submit your VIP concierge curation request?</div>
            <button class="modal-btn" onclick="submitData()">Confirm & Send</button>
        </div>
    </div>

    <script>
        let currentIndex = 0;
        const track = document.getElementById('slidesTrack');
        const gallery = document.getElementById('sliderContainer');
        const originalPhotos = Array.from(track.querySelectorAll('img'));
        let photos = [];
        let moving = false;
        let autoSlideTimer;

        function updateSlidePosition(withTransition = true) {
            if (!photos.length) return;
            const activePhoto = photos[(currentIndex + photos.length) % photos.length];
            gallery.style.setProperty('--gallery-backdrop', `url("${activePhoto.currentSrc || activePhoto.src}")`);
            track.style.transition = withTransition ? 'transform 0.5s ease-in-out' : 'none';
            track.style.transform = `translateX(-${(currentIndex + 1) * 100}%)`;
        }

        function rebuildGallery() {
            track.querySelectorAll('[data-loop-clone]').forEach(photo => photo.remove());
            photos = originalPhotos.filter(photo => getComputedStyle(photo).display !== 'none');
            if (!photos.length) return;
            currentIndex = (currentIndex + photos.length) % photos.length;
            function clone(photo) {
                const copy = photo.cloneNode(true);
                copy.removeAttribute('class');
                copy.removeAttribute('id');
                copy.style.display = 'block';
                copy.dataset.loopClone = 'true';
                copy.setAttribute('aria-hidden', 'true');
                copy.loading = 'eager';
                return copy;
            }
            track.prepend(clone(photos[photos.length - 1]));
            track.append(clone(photos[0]));
            moving = false;
            updateSlidePosition(false);
        }

        function moveSlide(direction) {
            if (moving || photos.length < 2) return;
            moving = true;
            currentIndex += direction;
            updateSlidePosition(true);
        }

        track.addEventListener('transitionend', event => {
            if (event.target !== track || event.propertyName !== 'transform') return;
            if (currentIndex < 0 || currentIndex >= photos.length) {
                currentIndex = (currentIndex + photos.length) % photos.length;
                updateSlidePosition(false);
                // Commit the invisible reset before accepting another movement.
                void track.offsetWidth;
            }
            moving = false;
        });

        function restartAutoSlide() {
            clearInterval(autoSlideTimer);
            autoSlideTimer = setInterval(() => moveSlide(1), 5000);
        }
        window.addEventListener('resize', rebuildGallery);
        document.getElementById('prevSlide').addEventListener('click', () => { moveSlide(-1); restartAutoSlide(); });
        document.getElementById('nextSlide').addEventListener('click', () => { moveSlide(1); restartAutoSlide(); });
        rebuildGallery();
        restartAutoSlide();


        function openConfirmModal() {
            const nameVal = document.getElementById('nameInput').value.trim();
            const dateVal = document.getElementById('dateInput').value;
            const contactVal = document.getElementById('contactInput').value.trim();

            if (!nameVal || !dateVal || !contactVal) {
                alert("Please fill in the required fields (*Name, Date, Contact).");
                return;
            }

            const countryCode = document.getElementById('countryCode').value;
            const fullPhone = `${countryCode} ${contactVal}`;
            const titleVal = document.getElementById('titleInput').value.trim() || "Not specified";
            
            document.getElementById('confirmText').textContent = `${nameVal} · ${dateVal} · ${fullPhone}. Send your VIP request?`;
            document.getElementById('confirmModal').classList.add('active');
        }

        let submitting = false;
        async function submitData() {
            if (submitting) return;
            const selected = name => document.querySelector(`input[name="${name}"]:checked`)?.value;
            const field = id => document.getElementById(id).value.trim();
            let party = selected('partySize');
            if (party === 'More than 4') {
                party = field('exactPartySize');
                if (!/^\d+$/.test(party) || Number(party) < 5 || Number(party) > 100) {
                    alert('Please enter the exact party size (5–100).'); return;
                }
            }
            if (!party || !selected('vibe') || !selected('budget') || !selected('guideType') || !field('hotelInput') || !field('contactInput')) {
                alert('Please select all required fields and enter your phone number.'); return;
            }
            submitting = true;
            document.getElementById('confirmModal').classList.remove('active');
            const button = document.querySelector('#formContent .submit-btn');
            button.disabled = true;
            button.textContent = 'Creating your itinerary…';

            try {
                const fullPhone = `${field('countryCode')} ${field('contactInput')}`;
                
                // Submit to the configured booking server.
                const response = await fetch(window.busanReservationUrl(), {
                    method: 'POST', 
                    headers: {
                        'Content-Type': 'application/json',
                        'x-busan-request': '1'
                    },
                    body: JSON.stringify({
                        name: field('nameInput'), 
                        company: field('companyInput'), 
                        jobTitle: field('titleInput'),
                        visitDate: field('dateInput'), 
                        partySize: party, 
                        vibe: selected('vibe'),
                        budget: selected('budget'), 
                        guideType: selected('guideType'), 
                        hotel: field('hotelInput'),
                        phone: fullPhone
                    })
                });
                if (!response.headers.get('content-type')?.includes('application/json')) {
                    throw new Error('The booking service is unavailable. Please try again later.');
                }
                const result = await response.json();
                if (!response.ok) throw new Error(typeof result.detail === 'string' ? result.detail : 'Please check your required fields.');
                
                if (result.status !== 'success' || !Number.isInteger(result.reservation_id)) throw new Error('Unexpected booking response. Please contact the concierge before retrying.');
                if (result.whatsapp_url) {
                    if (confirm("Request submitted successfully! Click OK to open WhatsApp and connect with your concierge now.")) {
                        window.open(result.whatsapp_url, '_blank');
                    }
                } else {
                    alert("Request submitted successfully!");
                }
                location.reload();
            } catch (error) {
                alert(error.message || 'Unable to create reservation. Please try again.');
            } finally {
                submitting = false;
                button.disabled = false;
                button.textContent = 'Request Access';
            }
        }
    </script>
</body>
</html>
